
name: Build Timetable Scheduler APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Flutter project
        run: |
          flutter create --platforms=android --org com.timetable /tmp/timetable_scheduler
          cp main.dart /tmp/timetable_scheduler/lib/main.dart

      - name: Install dependencies
        working-directory: /tmp/timetable_scheduler
        run: flutter pub get

      - name: Build APK
        working-directory: /tmp/timetable_scheduler
        run: flutter build apk --release

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Timetable-Scheduler-APK
          path: /tmp/timetable_scheduler/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
          
